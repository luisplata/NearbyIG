# Envelope de eventos y sus payloads. Todo evento —por SSE o por polling— es el
# mismo objeto: cambia el transporte, no el dato.
#
# El orden lo define `seq`, no `occurredAt`. Entre requests concurrentes el reloj
# no ordena nada; un contador por región sí. `id` es opaco para el cliente salvo
# el sufijo numérico, que es lo único que necesita para deduplicar: descarta todo
# `seq <= lastSeen`. Por eso `occurredAt` es informativo y se documenta como tal.

EventType:
  type: string
  enum:
    - profile.moved
    - profile.presence
    - ping.received
    - match.created
    - message.created
    - typing.started
  description: |
    Nombre del evento, cerrado a estos seis. El enum y los seis payloads entran
    completos ahora aunque S2 sólo emita los dos primeros: S4/S5 agregan campos a
    su payload, no tipos ni uniones nuevas, así que el cliente no cambia.

EventEnvelope:
  type: object
  additionalProperties: false
  required:
    - id
    - type
    - occurredAt
    - payload
  description: |
    Forma única de evento, idéntica en `data:` del SSE y en `events[]` del
    polling. `id` = `<regionKey>:<seq:012d>`; stream y poll de una región nunca
    entregan el prefijo de otra.
  properties:
    id:
      type: string
      pattern: '^[a-z]{2}:[0-9]{12}$'
      examples:
        - 'mx:000000000042'
      description: |
        `<regionKey>:<seq>` con `seq` de 12 dígitos, monotónico por región. El
        cliente sólo parsea el sufijo para deduplicar; el resto es opaco.
    type:
      $ref: '#/EventType'
    occurredAt:
      type: string
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$'
      examples:
        - '2026-11-12T18:00:00.000Z'
      description: |
        RFC 3339 UTC con milisegundos y sufijo `Z`. **Informativo: no ordena.** Dos
        eventos con este campo invertido siguen ordenados por `seq`.
    payload:
      $ref: '#/EventPayload'

EventPayload:
  description: |
    Cuerpo por `type`. La unión cubre hoy los seis tipos del enum: los dos de S2
    (`profile.moved`, `profile.presence`) y los cuatro de S4/S5, que se declaran
    ahora para que el cliente no cambie de unión cuando S4 los emita. Ningún
    payload lleva coordenadas: `profile.moved` usa `distanceM`/`bearingDeg` como el
    resto del sistema.
  oneOf:
    - $ref: '#/ProfileMovedPayload'
    - $ref: '#/ProfilePresencePayload'
    - $ref: '#/PingReceivedPayload'
    - $ref: '#/MatchCreatedPayload'
    - $ref: '#/MessageCreatedPayload'
    - $ref: '#/TypingStartedPayload'

ProfileMovedPayload:
  type: object
  additionalProperties: false
  required:
    - profileId
    - distanceM
    - bearingDeg
  description: El perfil se movió. Distancia y rumbo relativos a quien recibe.
  properties:
    profileId:
      type: string
      minLength: 1
      description: Id del perfil dentro de la región (la región la da el `id`).
    distanceM:
      type: integer
      minimum: 200
      maximum: 5000
      description: Distancia en metros, ya calculada por el server.
    bearingDeg:
      type: integer
      minimum: 0
      maximum: 359
      description: Rumbo en grados desde el norte, sentido horario.

ProfilePresencePayload:
  type: object
  additionalProperties: false
  required:
    - profileId
    - online
  description: El perfil cambió de estado de presencia. No hay coordenadas ni zona.
  properties:
    profileId:
      type: string
      minLength: 1
    online:
      type: boolean
      description: Nunca null.

# Payloads de S4/S5. Se declaran en S0 —con el envelope y el enum— para que el
# cliente tenga una sola unión desde el principio y S4 no renombre nada. El
# contenido es el mínimo con el que la demo puede pintar el evento: S4 agrega
# campos a su payload, que es un cambio de contrato revisable, no un tipo nuevo.

PingReceivedPayload:
  type: object
  additionalProperties: false
  required:
    - pingId
    - profileId
    - expiresAt
  description: |
    Alguien hizo ping a la sesión. `expiresAt` es lo que hace que el ping se pueda
    vencer (`PING_EXPIRED`): llega con el evento para que el cliente apague el
    botón sin adivinar el TTL.
  properties:
    pingId:
      type: string
      minLength: 1
      description: Id del ping, único por región.
    profileId:
      type: string
      minLength: 1
      description: Perfil que hizo el ping (la región la da el `id` del envelope).
    expiresAt:
      type: string
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$'
      description: RFC 3339 UTC con milisegundos, igual que `occurredAt`.

MatchCreatedPayload:
  type: object
  additionalProperties: false
  required:
    - matchId
    - profileId
  description: El ping fue aceptado y hay match. Sin coordenadas ni mensajes.
  properties:
    matchId:
      type: string
      minLength: 1
      description: Id del match; es lo que referencian los mensajes.
    profileId:
      type: string
      minLength: 1
      description: La otra parte del match.

MessageCreatedPayload:
  type: object
  additionalProperties: false
  required:
    - matchId
    - messageId
    - senderProfileId
  description: |
    Mensaje nuevo en un match. El cuerpo del mensaje no viaja acá a propósito: el
    evento avisa que hay algo nuevo y el cliente lo pide con el `messageId`.
  properties:
    matchId:
      type: string
      minLength: 1
    messageId:
      type: string
      minLength: 1
    senderProfileId:
      type: string
      minLength: 1
      description: Quién escribió; la sesión se reconoce por su propio `profileId`.

TypingStartedPayload:
  type: object
  additionalProperties: false
  required:
    - matchId
    - profileId
  description: |
    La otra parte está escribiendo. Efímero: no se persiste ni se replica.
  properties:
    matchId:
      type: string
      minLength: 1
    profileId:
      type: string
      minLength: 1

EventsPage:
  type: object
  additionalProperties: false
  required:
    - events
    - nextCursor
    - hasMore
  description: |
    Página de polling. Tres campos planos a propósito: `Page` es metadata y
    `allOf` + `additionalProperties: false` bloquearía los hermanos. No hay
    `truncated`: `hasMore` ya dice si queda algo y `nextCursor` es el `id` del
    último entregado — una página vacía lo devuelve igual al recibido.
  properties:
    events:
      type: array
      maxItems: 500
      items:
        $ref: '#/EventEnvelope'
    nextCursor:
      type:
        - string
        - 'null'
      pattern: '^[a-z]{2}:[0-9]{12}$'
      description: |
        Cursor de la próxima página: el `id` del último evento entregado. `null`
        sólo cuando no se recibió cursor y la página salió vacía.
    hasMore:
      type: boolean
      description: Si quedan eventos después de esta página.
