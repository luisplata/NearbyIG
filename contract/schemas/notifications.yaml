# Notificaciones (Sprint 5, delta v0.5).
#
# **Qué es y qué no es.** Una notificación es un aviso persistido de algo que
# pasó y que la demo quiere mostrar en la campana: un ping recibido, un match
# creado o un mensaje nuevo. No reemplaza a las bandejas existentes:
# `GET /pings?box=inbox`, `GET /matches` y `GET /matches/{matchId}/messages`
# siguen siendo las fuentes de verdad de cada flujo, y el badge de pings
# pendientes del cliente sigue funcionando igual (ver `contract/README.md`,
# "Notificaciones").
#
# **Persistidas, no derivadas.** El server las escribe cuando ocurre el hecho, en
# la misma transacción que lo produce. No se calculan al leer: una notificación
# leída tiene que seguir leída después de recargar, y un ping aceptado no puede
# convertirse en "no leído" porque cambió el estado del ping.
#
# **Sin PII de más.** El item lleva la proyección pública del otro (`PingPeer`,
# la misma de la bandeja) y referencias opacas (`pingId`, `matchId`,
# `messageId`). No lleva el texto del mensaje, ni coordenadas, ni distancia: el
# evento avisa que hay algo; el cliente lo abre por la API del recurso.

NotificationKind:
  type: string
  enum:
    - ping.received
    - match.created
    - message.created
  description: |
    Tipo de aviso. Los tres valores son los tres hechos de la demo que generan
    una notificación, con los mismos nombres que los eventos del stream.

    `ping.received` lo produce `POST /pings` para el destinatario humano;
    `match.created`, la aceptación de un ping; `message.created`, un mensaje
    nuevo del otro lado (incluida la respuesta automática de un bot).

NotificationItem:
  type: object
  additionalProperties: false
  required:
    - id
    - kind
    - createdAt
    - readAt
    - peer
    - pingId
    - matchId
    - messageId
  description: |
    Una notificación con lo que la campana necesita para dibujarse: el tipo, la
    fecha, si está leída y la identidad del otro.

    **`readAt` es el estado, no un flag aparte.** `null` = no leída. El cliente
    cuenta las que tienen `readAt: null`, y `POST /notifications/read` lo
    completa. No hay `unread: boolean` que pueda contradecir la fecha.

    **Las referencias son opcionales por tipo.** `ping.received` llena `pingId`;
    `match.created` llena `matchId`; `message.created` llena `matchId` y
    `messageId`. Las tres no viajan como una unión de schemas: dos `null` y una
    referencia es más simple para el cliente que tres shapes distintos.
  properties:
    id:
      type: string
      format: uuid
      description: Identidad de la notificación. Opaca.
    kind:
      $ref: '#/NotificationKind'
    createdAt:
      type: string
      format: date-time
      description: Cuándo se generó (RFC 3339 UTC con ms).
    readAt:
      type:
        - string
        - 'null'
      format: date-time
      description: |
        Cuándo se marcó leída, o `null` si sigue sin leer. Es la única autoridad
        del estado de lectura.
    peer:
      $ref: './pings.yaml#/PingPeer'
    pingId:
      type:
        - string
        - 'null'
      format: uuid
      description: El ping recibido, cuando `kind` es `ping.received`.
    matchId:
      type:
        - string
        - 'null'
      format: uuid
      description: |
        El match creado (`match.created`) o el match del mensaje
        (`message.created`).
    messageId:
      type:
        - string
        - 'null'
      format: uuid
      description: El mensaje nuevo, cuando `kind` es `message.created`.

NotificationList:
  type: object
  additionalProperties: false
  required:
    - notifications
    - unreadCount
  description: |
    Respuesta de `GET /notifications`: la campana completa (hasta 100, más
    reciente primero) y el total de no leídas.

    **`unreadCount` es del perfil de la sesión, no de la página.** Se cuenta
    sobre todas las notificaciones del perfil, no sobre las 100 que viajan: si la
    campana creciera, el badge no puede mentir por el corte. No hay cursor: la
    demo no acumula avisos y 100 es el techo declarado.
  properties:
    notifications:
      type: array
      maxItems: 100
      items:
        $ref: '#/NotificationItem'
    unreadCount:
      type: integer
      minimum: 0
      description: 'Notificaciones propias con `readAt: null`.'

NotificationReadRequest:
  type: object
  additionalProperties: false
  description: |
    Body de `POST /notifications/read`. Marca leídas **todas** o **las que
    nombra**:

    - sin body, `{}` o `notificationIds` ausente → todas las no leídas del perfil;
    - `notificationIds: [...]` → sólo esas (1 a 100 ids).

    Un id de otra región o de otro perfil no falla ni se marca: se ignora, porque
    la operación ya está acotada al perfil de la sesión. Lo que sí es 422 es un
    body con una forma inválida (`notificationIds` no es un array de uuid, o hay
    campos de más).
  properties:
    notificationIds:
      type: array
      minItems: 1
      maxItems: 100
      description: Ids a marcar. Ausente = todas las no leídas.
      items:
        type: string
        format: uuid

NotificationReadResult:
  type: object
  additionalProperties: false
  required:
    - marked
    - unreadCount
  description: |
    Resultado de `POST /notifications/read`: cuántas se marcaron en esta llamada
    y cuántas quedan sin leer. El cliente actualiza el badge con el segundo sin
    un `GET` extra.

    Repetirlo es idempotente por resultado: la segunda vez `marked` es `0` y
    `unreadCount` no cambia.
  properties:
    marked:
      type: integer
      minimum: 0
      description: Notificaciones que pasaron de no leídas a leídas en esta llamada.
    unreadCount:
      type: integer
      minimum: 0
      description: Notificaciones propias que siguen sin leer después de la llamada.
