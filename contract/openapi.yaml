components:
  # Respuestas de error compartidas. Todas tienen la misma forma
  # (`application/problem+json` → `Problem`) porque el cliente tiene que poder
  # parsear cualquier 4xx/5xx con un solo shape.
  #
  # `x-error-code` no es un capricho: es lo que ata el status del response al
  # `x-status` del código en `schemas/errors.yaml`, así el test compara ambos
  # números en vez de confiar en que nadie se equivoque al escribirlos.
  responses:
    Unauthorized:
      description: |
        Falta la credencial o el JWT venció (`UNAUTHENTICATED`). Es el 401 de toda
        operation que autentica con `demoSession`; el ticket de stream tiene su
        propio 401 porque sus dos códigos no existen fuera de `GET /events`.
      x-error-code: UNAUTHENTICATED
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    StreamTicketInvalid:
      description: |
        401 de `GET /events`, que autentica con `streamTicket` en lugar del header.
        El ticket ausente o vencido es `TICKET_EXPIRED`; el ya consumido es
        `TICKET_REUSED`. Los dos códigos viajan acá y en ningún otro lado: un
        status puede volver con más de un `code` y `Problem.code` es el
        discriminante.
      x-error-code:
        - TICKET_EXPIRED
        - TICKET_REUSED
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    Conflict:
      description: |
        El pedido choca con el estado del slot demo (`PROFILE_IN_USE`). En
        `POST /auth/demo-session` es un slot que ya ocupa otra sesión viva: el
        claim no desaloja, así que el cliente tiene que elegir otro o pedir el
        takeover. En `POST /auth/takeover` es un pedido sobre el slot que ya
        ocupa la propia sesión que llama: no hay nada que desalojar y reemitir el
        token apagaría la credencial en uso.
      x-error-code: PROFILE_IN_USE
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    Unprocessable:
      description: |
        El pedido está bien formado como HTTP pero no cumple el schema: body,
        query o cursor (`VALIDATION_FAILED`).
      x-error-code: VALIDATION_FAILED
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    Internal:
      description: |
        Falla no clasificada (`INTERNAL`). Se declara acá y la cablea S2 en las
        operations de events y presence; en auth no hay nada que pueda romperse
        del lado del cliente más allá del slot.
      x-error-code: INTERNAL
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    CursorExpired:
      description: |
        El cursor (`Last-Event-ID` de `GET /events` o `?cursor=` de
        `GET /events/poll`) quedó fuera de la retención del log (`CURSOR_EXPIRED`).
        No es un 400: el pedido está bien formado, lo que ya no existe es el
        evento. Un cursor malformado es `VALIDATION_FAILED` (422).
      x-error-code: CURSOR_EXPIRED
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    RegionUnavailable:
      description: |
        La región pedida está bien formada pero el catálogo no la sirve: sólo
        existen `mx` y `co` (`REGION_UNAVAILABLE`). Un `regionKey` ausente o con
        otra forma es `VALIDATION_FAILED`, mismo 422.
      x-error-code: REGION_UNAVAILABLE
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    RegionMismatch:
      description: |
        El recurso pedido pertenece a otra región que la de la sesión
        (`REGION_MISMATCH`). Es un 403 y no un 404 a propósito: el perfil existe,
        lo que no existe es el derecho a verlo desde esta sesión.
      x-error-code: REGION_MISMATCH
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    ProfileNotFound:
      description: |
        El `profileId` que nombra la sesión ya no existe en el catálogo
        (`PROFILE_NOT_FOUND`): se regeneró el seed debajo de una sesión viva, así
        que el token es válido pero apunta a un perfil que no está. Es un 404 y no
        un 401: la credencial no está mal, el recurso sí.
      x-error-code: PROFILE_NOT_FOUND
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    ProfileRequired:
      description: |
        La sesión no encarna un perfil del catálogo (`PROFILE_REQUIRED`): es un
        invitado de relleno, porque los 10 slots de la región estaban ocupados.
        Bloquear y reportar son actos de una persona contra otra y el invitado no
        es una persona de la demo. Es un 403 y no un 404: la credencial es válida,
        lo que falta es el sujeto.
      x-error-code: PROFILE_REQUIRED
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    PresenceStale:
      description: |
        No hay presencia viva que apagar (`PRESENCE_STALE`): nunca se registró, ya
        se borró o venció. La operación es idempotente en el resultado, no en el
        status, para que el cliente distinga "apagué mi presencia" de "no había
        nada que apagar".
      x-error-code: PRESENCE_STALE
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    PresenceUnprocessable:
      description: |
        422 de `PUT /presence`, con dos `code`: `VALIDATION_FAILED` cuando el body
        no trae exactamente uno de `point`/`demoZoneKey` (o no cumple su forma), y
        `ZONE_UNKNOWN` cuando la `demoZoneKey` existe como forma pero no en el
        catálogo de la región. El status es uno y el discriminante es
        `Problem.code`, igual que en el 401.
      x-error-code:
        - VALIDATION_FAILED
        - ZONE_UNKNOWN
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    RateLimited:
      description: |
        El cliente superó el límite de pedidos de la ventana (`RATE_LIMITED`). Es
        un 429 y no un 422: el pedido está bien formado, lo que falta es cuota. El
        cliente reintenta con backoff, no corrigiendo el body.
      x-error-code: RATE_LIMITED
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    NotImplemented:
      description: |
        La operation existe en el contrato y todavía no está implementada en el
        sprint que la sirve (`NOT_IMPLEMENTED`). Un server de S1/S2 que recibe
        `GET /discovery` responde esto en vez de 404: el path existe, la
        implementación no. Así `x-implementation-sprint` es accionable.
      x-error-code: NOT_IMPLEMENTED
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    PingForbidden:
      description: |
        El ping existe pero la sesión no es su destinatario (`PING_FORBIDDEN`).
        Es un 403 y no un 404: el recurso está, lo que falta es el derecho a
        resolverlo. También es el 403 de `POST /pings` cuando la sesión no tiene
        perfil propio (invitado de relleno): un invitado no es una persona a la
        que otro pueda contestarle.
      x-error-code: PING_FORBIDDEN
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    PingForbiddenOrBlocked:
      description: |
        El emisor no puede pinguear a ese destinatario por una de dos razones, y
        `Problem.code` las separa: `PING_FORBIDDEN` cuando la sesión no tiene
        perfil propio (invitado de relleno) y `CHAT_BLOCKED` cuando el par está
        bloqueado en cualquier dirección. El mensaje no revela quién bloqueó a
        quién.
      x-error-code:
        - PING_FORBIDDEN
        - CHAT_BLOCKED
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    PingTargetNotFound:
      description: |
        El destinatario de `POST /pings` no existe para esta sesión
        (`PROFILE_NOT_FOUND`): `profileId` de otra región, id inexistente, o un
        bot cuyo dueño ya no tiene presencia viva. Un ping no cruza regiones y un
        bot sin presencia no está.
      x-error-code: PROFILE_NOT_FOUND
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    PingNotFound:
      description: |
        El `pingId` del path no existe (`PING_NOT_FOUND`). Un id malformado (no
        uuid) es 422 `VALIDATION_FAILED`, no un 404: el pedido está mal escrito
        antes de que el recurso falte.
      x-error-code: PING_NOT_FOUND
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    PingDuplicate:
      description: |
        El par dirigido ya tiene un ping pendiente (`PING_DUPLICATE`). No es un
        error del cliente que se corrige con un body distinto: hay que esperar a
        que el otro conteste o venza. La carrera entre dos envíos simultáneos la
        resuelve un índice único parcial, no un chequeo previo.
      x-error-code: PING_DUPLICATE
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    PingResolved:
      description: |
        El ping ya no está pendiente (`PING_RESOLVED`): lo aceptaron, lo
        rechazaron o lo cerró una aceptación previa. Repetir la acción no es un
        no-op silencioso; el cliente se entera y deja de reintentar.
      x-error-code: PING_RESOLVED
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    PingExpired:
      description: |
        El ping venció (`PING_EXPIRED`). En `POST /pings` es el pendiente del par
        que ya pasó su `expiresAt`: queda cerrado y el próximo envío crea uno
        nuevo. En `accept`/`reject` es un ping que se resolvió tarde: no hay
        match. El reloj del server es la autoridad, no el del cliente.
      x-error-code: PING_EXPIRED
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    MatchNotFound:
      description: |
        El `matchId` del path no existe en la región de la sesión
        (`MATCH_NOT_FOUND`). Un match de otra región es exactamente eso: no
        existe para esta sesión. Un id malformado (no uuid) es 422
        `VALIDATION_FAILED`, no un 404.
      x-error-code: MATCH_NOT_FOUND
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    ChatBlocked:
      description: |
        El match existe en la región pero la sesión no es parte de él
        (`CHAT_BLOCKED`). Es un 403 y no un 404: el recurso está, lo que falta es
        el derecho a leer o escribir esa conversación.

        Desde v0.5 el mismo código cubre el bloqueo real en las dos puertas del
        par: `POST /pings` cuando cualquiera de los dos bloqueó al otro, y
        `POST /matches/{matchId}/messages` cuando la conversación existe pero el
        par está bloqueado. El mensaje de error no dice quién bloqueó a quién:
        el bloqueo ajeno es invisible para el bloqueado.
      x-error-code: CHAT_BLOCKED
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    MatchClosed:
      description: |
        La conversación no acepta mensajes nuevos (`MATCH_CLOSED`): el otro lado
        ya no existe para la demo (un bot cuyo dueño se fue, un perfil regenerado
        por un seed) o la conversación se cerró porque el dueño del bot cambió de
        zona demo y el bot se volvió a sembrar en otra (`v0.5`). Se puede leer
        —la historia queda legible— y marcar leída; lo que no se puede es
        escribir.
      x-error-code: MATCH_CLOSED
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

  securitySchemes:
    demoSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT corto emitido por `POST /auth/demo-session`. Viaja sólo en el header
        `Authorization`. No hay OAuth, cookies ni API keys de terceros.
    streamTicket:
      type: apiKey
      in: query
      name: ticket
      description: |
        Ticket de 30 s y un solo uso emitido por `POST /auth/stream-ticket`.
        Existe sólo porque `EventSource` no puede mandar headers: se aplica
        **únicamente** a `GET /events`. Un JWT en query se filtra por logs,
        `Referer` e historial; un ticket efímero y de un uso acota el daño a 30 s.

  schemas:
    DemoSession:
      $ref: './schemas/auth.yaml#/DemoSession'
    DemoSessionRequest:
      $ref: './schemas/auth.yaml#/DemoSessionRequest'
    TakeoverRequest:
      $ref: './schemas/auth.yaml#/TakeoverRequest'
    StreamTicket:
      $ref: './schemas/auth.yaml#/StreamTicket'
    EventEnvelope:
      $ref: './schemas/events.yaml#/EventEnvelope'
    EventPayload:
      $ref: './schemas/events.yaml#/EventPayload'
    EventType:
      $ref: './schemas/events.yaml#/EventType'
    EventsPage:
      $ref: './schemas/events.yaml#/EventsPage'
    ProfileMovedPayload:
      $ref: './schemas/events.yaml#/ProfileMovedPayload'
    ProfilePresencePayload:
      $ref: './schemas/events.yaml#/ProfilePresencePayload'
    PingReceivedPayload:
      $ref: './schemas/events.yaml#/PingReceivedPayload'
    MatchCreatedPayload:
      $ref: './schemas/events.yaml#/MatchCreatedPayload'
    MessageCreatedPayload:
      $ref: './schemas/events.yaml#/MessageCreatedPayload'
    TypingStartedPayload:
      $ref: './schemas/events.yaml#/TypingStartedPayload'
    ErrorCode:
      $ref: './schemas/errors.yaml#/ErrorCode'
    Problem:
      $ref: './schemas/errors.yaml#/Problem'
    KeyLabel:
      $ref: './schemas/common.yaml#/KeyLabel'
    Page:
      $ref: './schemas/common.yaml#/Page'
    Region:
