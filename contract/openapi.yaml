# Raíz del contrato. Todo lo demás se cuelga de acá con `$ref` relativos:
#   paths/*.yaml    → path items (el archivo es un mapa nombre → path item)
#   schemas/*.yaml  → componentes reutilizables
#
# El documento NO se escribe para un servidor concreto: Sprint 1 consume este
# contrato y debe cumplirlo. Ver contract/README.md.

openapi: 3.1.0

info:
  title: NearbyIG API
  version: 0.1.0
  summary: Contrato congelado de la demo (S1–S3).
  description: |
    Contrato de la demo NearbyIG escrito a mano antes del server. La superficie
    está congelada en S1–S3; pings, matches, chat, block, report y `/health`
    quedan fuera hasta que exista un diseño que los congele (S4/S5).

    Cada operation declara `x-implementation-sprint` con el sprint que la
    implementa. Ninguna operation se implementa en Sprint 0: acá sólo se
    declara la forma.

    `x-contract-id` es el hash corto (12 hex de SHA-256) del documento canónico
    con este mismo campo reemplazado por `pending`, para que el hash no dependa
    de sí mismo. `contract:validate` lo recalcula y falla si no coincide.
  x-contract-id: 'c15b856f71cc'

servers:
  - url: http://localhost:3000
    description: Server local del Sprint 1 (todavía no existe).

# Todas las operations piden sesión demo salvo que declaren `security: []`.
security:
  - demoSession: []

tags:
  - name: auth
    description: Sesión demo, logout y ticket efímero para `GET /events`.
  - name: events
    description: |
      Stream SSE y polling del mismo log de eventos. El orden lo da `seq`, no
      `occurredAt`; el cliente deduplica con `seq <= lastSeen`.
  - name: catalog
    description: |
      Regiones y zonas de la demo. Sólo proyecciones: `ZoneSummary` lleva
      `zoneKey`, `nameKey` y `regionKey`, nunca geometría. El polígono vive en
      `contract/catalog/zones.json`, fuera del spec.
  - name: profiles
    description: |
      Perfiles del catálogo demo: 10 humanos por región (`mx`, `co`). La fila es
      `ProfileSummary`, con los campos del dataset más `regionKey`, `demoSlot` y
      `sourceType`. El avatar se resuelve por `photoId`; ningún response expone
      coordenadas.
  - name: presence
    description: |
      Dónde está la sesión. `PUT /presence` es la única entrada del contrato que
      acepta coordenadas: recibe un punto privado o una `demoZoneKey` y devuelve
      la proyección (`regionKey`, `zoneKey`), nunca el punto. Región y zona se
      derivan con `ST_Covers` contra los polígonos del catálogo; fuera de todo
      polígono es `fallbackRequired: true`, no un error.
  - name: discovery
    description: |
      Quién está cerca. Devuelve `ProfileSummary` filtrado por radio, intención,
      género, verificado y online. `distanceM` y `bearingDeg` los calcula el
      server y se redondean al metro y al grado; la respuesta no lleva el punto de
      nadie.

paths:
  /auth/demo-session:
    $ref: './paths/auth.yaml#/demo-session'
  /auth/logout:
    $ref: './paths/auth.yaml#/logout'
  /auth/stream-ticket:
    $ref: './paths/auth.yaml#/stream-ticket'
  /events:
    $ref: './paths/events.yaml#/events'
  /events/poll:
    $ref: './paths/events.yaml#/events-poll'
  /demo/regions:
    $ref: './paths/catalog.yaml#/demo-regions'
  /demo/zones:
    $ref: './paths/catalog.yaml#/demo-zones'
  /demo/profiles:
    $ref: './paths/profiles.yaml#/demo-profiles'
  /presence:
    $ref: './paths/presence.yaml#/presence'
  /discovery:
    $ref: './paths/discovery.yaml#/discovery'

components:
  # Respuestas de error compartidas. Todas tienen la misma forma
  # (`application/problem+json` → `Problem`) porque el cliente tiene que poder
  # parsear cualquier 4xx/5xx con un solo shape.
  #
  # `x-error-code` no es un capricho: es lo que ata el status del response al
  # `x-status` del código en `schemas/errors.yaml`, así el test compara ambos
  # números en vez de confiar en que nadie se equivoque al escribirlos.
  responses:
    Unauthorized:
      description: |
        Falta la credencial o el JWT venció (`UNAUTHENTICATED`). Es el 401 de toda
        operation que autentica con `demoSession`; el ticket de stream tiene su
        propio 401 porque sus dos códigos no existen fuera de `GET /events`.
      x-error-code: UNAUTHENTICATED
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    StreamTicketInvalid:
      description: |
        401 de `GET /events`, que autentica con `streamTicket` en lugar del header.
        El ticket ausente o vencido es `TICKET_EXPIRED`; el ya consumido es
        `TICKET_REUSED`. Los dos códigos viajan acá y en ningún otro lado: un
        status puede volver con más de un `code` y `Problem.code` es el
        discriminante.
      x-error-code:
        - TICKET_EXPIRED
        - TICKET_REUSED
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    Conflict:
      description: |
        El recurso pedido choca con el estado actual: el slot demo ya está
        ocupado por otra sesión viva (`PROFILE_IN_USE`).
      x-error-code: PROFILE_IN_USE
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    Unprocessable:
      description: |
        El pedido está bien formado como HTTP pero no cumple el schema: body,
        query o cursor (`VALIDATION_FAILED`).
      x-error-code: VALIDATION_FAILED
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    Internal:
      description: |
        Falla no clasificada (`INTERNAL`). Se declara acá y la cablea S2 en las
        operations de events y presence; en auth no hay nada que pueda romperse
        del lado del cliente más allá del slot.
      x-error-code: INTERNAL
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    CursorExpired:
      description: |
        El cursor (`Last-Event-ID` de `GET /events` o `?cursor=` de
        `GET /events/poll`) quedó fuera de la retención del log (`CURSOR_EXPIRED`).
        No es un 400: el pedido está bien formado, lo que ya no existe es el
        evento. Un cursor malformado es `VALIDATION_FAILED` (422).
      x-error-code: CURSOR_EXPIRED
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    RegionUnavailable:
      description: |
        La región pedida está bien formada pero el catálogo no la sirve: sólo
        existen `mx` y `co` (`REGION_UNAVAILABLE`). Un `regionKey` ausente o con
        otra forma es `VALIDATION_FAILED`, mismo 422.
      x-error-code: REGION_UNAVAILABLE
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    RegionMismatch:
      description: |
        El recurso pedido pertenece a otra región que la de la sesión
        (`REGION_MISMATCH`). Es un 403 y no un 404 a propósito: el perfil existe,
        lo que no existe es el derecho a verlo desde esta sesión.
      x-error-code: REGION_MISMATCH
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    ProfileNotFound:
      description: |
        El `profileId` que nombra la sesión ya no existe en el catálogo
        (`PROFILE_NOT_FOUND`): se regeneró el seed debajo de una sesión viva, así
        que el token es válido pero apunta a un perfil que no está. Es un 404 y no
        un 401: la credencial no está mal, el recurso sí.
      x-error-code: PROFILE_NOT_FOUND
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    PresenceStale:
      description: |
        No hay presencia viva que apagar (`PRESENCE_STALE`): nunca se registró, ya
        se borró o venció. La operación es idempotente en el resultado, no en el
        status, para que el cliente distinga "apagué mi presencia" de "no había
        nada que apagar".
      x-error-code: PRESENCE_STALE
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    PresenceUnprocessable:
      description: |
        422 de `PUT /presence`, con dos `code`: `VALIDATION_FAILED` cuando el body
        no trae exactamente uno de `point`/`demoZoneKey` (o no cumple su forma), y
        `ZONE_UNKNOWN` cuando la `demoZoneKey` existe como forma pero no en el
        catálogo de la región. El status es uno y el discriminante es
        `Problem.code`, igual que en el 401.
      x-error-code:
        - VALIDATION_FAILED
        - ZONE_UNKNOWN
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    RateLimited:
      description: |
        El cliente superó el límite de pedidos de la ventana (`RATE_LIMITED`). Es
        un 429 y no un 422: el pedido está bien formado, lo que falta es cuota. El
        cliente reintenta con backoff, no corrigiendo el body.
      x-error-code: RATE_LIMITED
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    NotImplemented:
      description: |
        La operation existe en el contrato y todavía no está implementada en el
        sprint que la sirve (`NOT_IMPLEMENTED`). Un server de S1/S2 que recibe
        `GET /discovery` responde esto en vez de 404: el path existe, la
        implementación no. Así `x-implementation-sprint` es accionable.
      x-error-code: NOT_IMPLEMENTED
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

  securitySchemes:
    demoSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT corto emitido por `POST /auth/demo-session`. Viaja sólo en el header
        `Authorization`. No hay OAuth, cookies ni API keys de terceros.
    streamTicket:
      type: apiKey
      in: query
      name: ticket
      description: |
        Ticket de 30 s y un solo uso emitido por `POST /auth/stream-ticket`.
        Existe sólo porque `EventSource` no puede mandar headers: se aplica
        **únicamente** a `GET /events`. Un JWT en query se filtra por logs,
        `Referer` e historial; un ticket efímero y de un uso acota el daño a 30 s.

  schemas:
    DemoSession:
      $ref: './schemas/auth.yaml#/DemoSession'
    DemoSessionRequest:
      $ref: './schemas/auth.yaml#/DemoSessionRequest'
    StreamTicket:
      $ref: './schemas/auth.yaml#/StreamTicket'
    EventEnvelope:
      $ref: './schemas/events.yaml#/EventEnvelope'
    EventPayload:
      $ref: './schemas/events.yaml#/EventPayload'
    EventType:
      $ref: './schemas/events.yaml#/EventType'
    EventsPage:
      $ref: './schemas/events.yaml#/EventsPage'
    ProfileMovedPayload:
      $ref: './schemas/events.yaml#/ProfileMovedPayload'
    ProfilePresencePayload:
      $ref: './schemas/events.yaml#/ProfilePresencePayload'
    PingReceivedPayload:
      $ref: './schemas/events.yaml#/PingReceivedPayload'
    MatchCreatedPayload:
      $ref: './schemas/events.yaml#/MatchCreatedPayload'
    MessageCreatedPayload:
      $ref: './schemas/events.yaml#/MessageCreatedPayload'
    TypingStartedPayload:
      $ref: './schemas/events.yaml#/TypingStartedPayload'
    ErrorCode:
      $ref: './schemas/errors.yaml#/ErrorCode'
    Problem:
      $ref: './schemas/errors.yaml#/Problem'
    KeyLabel:
      $ref: './schemas/common.yaml#/KeyLabel'
    Page:
      $ref: './schemas/common.yaml#/Page'
    Region:
      $ref: './schemas/region.yaml#/Region'
    RegionKey:
      $ref: './schemas/common.yaml#/RegionKey'
    RegionList:
      $ref: './schemas/region.yaml#/RegionList'
    SourceType:
      $ref: './schemas/common.yaml#/SourceType'
    ZoneList:
      $ref: './schemas/region.yaml#/ZoneList'
    ZoneSummary:
      $ref: './schemas/region.yaml#/ZoneSummary'
    Gender:
      $ref: './schemas/common.yaml#/Gender'
    Intention:
      $ref: './schemas/common.yaml#/Intention'
    ProfileList:
      $ref: './schemas/profile.yaml#/ProfileList'
    ProfileSummary:
      $ref: './schemas/profile.yaml#/ProfileSummary'
    SelfProfile:
      $ref: './schemas/profile.yaml#/SelfProfile'
    # `PresenceUpdate` y `PrivatePoint` NO se montan: llevan el punto privado y
    # `components.schemas` es la superficie que puede salir (ver
    # schemas/presence.yaml). El requestBody de `PUT /presence` los referencia
    # directo, que es donde tienen que estar.
    PresenceState:
      $ref: './schemas/presence.yaml#/PresenceState'
    DiscoveryQuery:
      $ref: './schemas/discovery.yaml#/DiscoveryQuery'
    DiscoveryResult:
      $ref: './schemas/discovery.yaml#/DiscoveryResult'
