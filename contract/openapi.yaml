# Raíz del contrato. Todo lo demás se cuelga de acá con `$ref` relativos:
#   paths/*.yaml    → path items (el archivo es un mapa nombre → path item)
#   schemas/*.yaml  → componentes reutilizables
#
# El documento NO se escribe para un servidor concreto: Sprint 1 consume este
# contrato y debe cumplirlo. Ver contract/README.md.

openapi: 3.1.0

info:
  title: NearbyIG API
  version: 0.1.0
  summary: Contrato congelado de la demo (S1–S3).
  description: |
    Contrato de la demo NearbyIG escrito a mano antes del server. La superficie
    está congelada en S1–S3; pings, matches, chat, block, report y `/health`
    quedan fuera hasta que exista un diseño que los congele (S4/S5).

    Cada operation declara `x-implementation-sprint` con el sprint que la
    implementa. Ninguna operation se implementa en Sprint 0: acá sólo se
    declara la forma.

    `x-contract-id` es el hash corto (12 hex de SHA-256) del documento canónico
    con este mismo campo reemplazado por `pending`, para que el hash no dependa
    de sí mismo. `contract:validate` lo recalcula y falla si no coincide.
  x-contract-id: '2661d6cc0a6c'

servers:
  - url: http://localhost:3000
    description: Server local del Sprint 1 (todavía no existe).

# Todas las operations piden sesión demo salvo que declaren `security: []`.
security:
  - demoSession: []

tags:
  - name: auth
    description: Sesión demo, logout y ticket efímero para `GET /events`.
  - name: events
    description: |
      Stream SSE y polling del mismo log de eventos. El orden lo da `seq`, no
      `occurredAt`; el cliente deduplica con `seq <= lastSeen`.

paths:
  /auth/demo-session:
    $ref: './paths/auth.yaml#/demo-session'
  /auth/logout:
    $ref: './paths/auth.yaml#/logout'
  /auth/stream-ticket:
    $ref: './paths/auth.yaml#/stream-ticket'
  /events:
    $ref: './paths/events.yaml#/events'
  /events/poll:
    $ref: './paths/events.yaml#/events-poll'

components:
  # Respuestas de error compartidas. Todas tienen la misma forma
  # (`application/problem+json` → `Problem`) porque el cliente tiene que poder
  # parsear cualquier 4xx/5xx con un solo shape.
  #
  # `x-error-code` no es un capricho: es lo que ata el status del response al
  # `x-status` del código en `schemas/errors.yaml`, así el test compara ambos
  # números en vez de confiar en que nadie se equivoque al escribirlos.
  responses:
    Unauthorized:
      description: |
        Falta la credencial, el JWT venció o el ticket de stream no es válido.
        `code` distingue los tres casos: `UNAUTHENTICATED`, `TICKET_EXPIRED`,
        `TICKET_REUSED`.
      x-error-code: UNAUTHENTICATED
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    Conflict:
      description: |
        El recurso pedido choca con el estado actual: el slot demo ya está
        ocupado por otra sesión viva (`PROFILE_IN_USE`).
      x-error-code: PROFILE_IN_USE
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    Unprocessable:
      description: |
        El pedido está bien formado como HTTP pero no cumple el schema: body,
        query o cursor (`VALIDATION_FAILED`).
      x-error-code: VALIDATION_FAILED
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    Internal:
      description: |
        Falla no clasificada (`INTERNAL`). Se declara acá y la cablea S2 en las
        operations de events y presence; en auth no hay nada que pueda romperse
        del lado del cliente más allá del slot.
      x-error-code: INTERNAL
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

    CursorExpired:
      description: |
        El cursor (`Last-Event-ID` de `GET /events` o `?cursor=` de
        `GET /events/poll`) quedó fuera de la retención del log (`CURSOR_EXPIRED`).
        No es un 400: el pedido está bien formado, lo que ya no existe es el
        evento. Un cursor malformado es `VALIDATION_FAILED` (422).
      x-error-code: CURSOR_EXPIRED
      content:
        application/problem+json:
          schema:
            $ref: './schemas/errors.yaml#/Problem'

  securitySchemes:
    demoSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT corto emitido por `POST /auth/demo-session`. Viaja sólo en el header
        `Authorization`. No hay OAuth, cookies ni API keys de terceros.
    streamTicket:
      type: apiKey
      in: query
      name: ticket
      description: |
        Ticket de 30 s y un solo uso emitido por `POST /auth/stream-ticket`.
        Existe sólo porque `EventSource` no puede mandar headers: se aplica
        **únicamente** a `GET /events`. Un JWT en query se filtra por logs,
        `Referer` e historial; un ticket efímero y de un uso acota el daño a 30 s.

  schemas:
    DemoSession:
      $ref: './schemas/auth.yaml#/DemoSession'
    DemoSessionRequest:
      $ref: './schemas/auth.yaml#/DemoSessionRequest'
    StreamTicket:
      $ref: './schemas/auth.yaml#/StreamTicket'
    EventEnvelope:
      $ref: './schemas/events.yaml#/EventEnvelope'
    EventPayload:
      $ref: './schemas/events.yaml#/EventPayload'
    EventType:
      $ref: './schemas/events.yaml#/EventType'
    EventsPage:
      $ref: './schemas/events.yaml#/EventsPage'
    ProfileMovedPayload:
      $ref: './schemas/events.yaml#/ProfileMovedPayload'
    ProfilePresencePayload:
      $ref: './schemas/events.yaml#/ProfilePresencePayload'
    ErrorCode:
      $ref: './schemas/errors.yaml#/ErrorCode'
    Problem:
      $ref: './schemas/errors.yaml#/Problem'
    KeyLabel:
      $ref: './schemas/common.yaml#/KeyLabel'
    Page:
      $ref: './schemas/common.yaml#/Page'
    RegionKey:
      $ref: './schemas/common.yaml#/RegionKey'
    SourceType:
      $ref: './schemas/common.yaml#/SourceType'
