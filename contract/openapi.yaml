# Raíz del contrato. Todo lo demás se cuelga de acá con `$ref` relativos:
#   paths/*.yaml    → path items (el archivo es un mapa nombre → path item)
#   schemas/*.yaml  → componentes reutilizables
#
# El documento NO se escribe para un servidor concreto: Sprint 1 consume este
# contrato y debe cumplirlo. Ver contract/README.md.

openapi: 3.1.0

info:
  title: NearbyIG API
  version: 0.5.0
  summary: Contrato congelado de la demo (S1–S5).
  description: |
    Contrato de la demo NearbyIG escrito a mano antes del server. La superficie
    está congelada en S1–S5; block, report y notificaciones entraron en v0.5 y
    `/health` sigue fuera (es operación, no producto).

    Cada operation declara `x-implementation-sprint` con el sprint que la
    implementa. Ninguna operation se implementa en Sprint 0: acá sólo se
    declara la forma.

    **v0.2 (delta sobre v0.1):** la ocupación de un slot demo se ve antes de
    intentar reclamarlo y el desalojo se pide explícitamente.
      * `ProfileSummary.inUse` publica si hay una sesión viva en el slot, así el
        selector de perfiles puede mostrar "en uso" sin comer un 409.
      * `POST /auth/takeover` desaloja un slot concreto y devuelve una
        `DemoSession` nueva. `POST /auth/demo-session` sigue respondiendo
        `409 PROFILE_IN_USE` sobre un slot ocupado: el desalojo nunca es
        implícito.
    Ningún DTO, código de error ni response cambia de forma.

    **v0.3 (delta sobre v0.2):** entra el flujo de conexión mínimo de S4.
      * `POST /pings`, `GET /pings`, `POST /pings/{pingId}/accept` y
        `POST /pings/{pingId}/reject`: enviar, mirar la bandeja y resolver.
      * `Ping`, `PingList` (con `PingPeer`) y `Match`. El bot acepta solo.
      * `PING_DUPLICATE` y `PING_EXPIRED` salen de `x-reserved`: ya tienen
        operation. Se suman `PING_FORBIDDEN`, `PING_NOT_FOUND` y
        `PING_RESOLVED`, que son las tres decisiones nuevas del cliente.
    Chat, block y report siguen fuera.

    **v0.4 (delta sobre v0.3):** entra el chat, que es lo que le faltaba al
    match para ser una conversación.
      * `GET /matches` — la bandeja de matches con el otro perfil, el último
        mensaje y `unreadCount`.
      * `GET /matches/{matchId}/messages` — la conversación paginada con cursor
        opaco, en orden cronológico.
      * `POST /matches/{matchId}/messages` — escribir, idempotente por
        `clientMessageId`. Si el otro lado es un bot, el bot responde solo.
      * `POST /matches/{matchId}/read` — marcar leídos los mensajes del otro.
      * `GET /me` — el perfil de la propia sesión (`SelfProfile`, que estaba
        declarado desde S0 sin consumer).
      * `Message`, `MessageCreate`, `MessagePage`, `MatchListItem` y `MatchList`.
      * `MATCH_NOT_FOUND` y `CHAT_BLOCKED` salen de `x-reserved`; se suma
        `MATCH_CLOSED` (409) para una conversación que ya no acepta mensajes. El
        enum queda sin códigos reservados.
      * `message.created` y `typing.started` dejan de ser payloads declarados sin
        productor: el chat los emite en el stream existente.
    Block y report siguen fuera.

    **v0.5 (delta sobre v0.4):** entra la privacidad de S5. La regla es aditiva:
    ninguna forma existente se rompe salvo `PresenceState`, que suma
    `visibility`.
      * `Visibility` (`visible` | `ghost`) en `PUT /presence` y en
        `PresenceState`. Ghost es "online pero invisible": la sesión sigue viva y
        viendo, pero ni el humano ni sus bots aparecen para los demás.
      * `GET /blocks`, `POST /blocks` y `DELETE /blocks/{profileId}`: bloqueo
        idempotente, con identidad del otro en la lista. Bloquear un bot bloquea
        a su dueño.
      * `POST /reports`: registro sin consola de moderación y sin PII en el
        acuse.
      * `GET /notifications` y `POST /notifications/read`: avisos persistidos de
        ping, match y mensaje, con `unreadCount` y marca de leídas. Es aditivo: el
        badge de pings pendientes del cliente sigue funcionando.
      * `PROFILE_REQUIRED` (403) es el único código nuevo: el invitado de relleno
        no tiene perfil que bloquear ni reportar.
      * `MATCH_CLOSED` ahora también cierra una conversación con un bot cuyo
        dueño cambió de zona: la historia queda legible y no acepta mensajes
        nuevos.

    `x-contract-id` es el hash corto (12 hex de SHA-256) del documento canónico
    con este mismo campo reemplazado por `pending`, para que el hash no dependa
    de sí mismo. `contract:validate` lo recalcula y falla si no coincide.
  x-contract-id: '3225f7e3ecd7'

servers:
  - url: http://localhost:3000
    description: Server local del Sprint 1 (todavía no existe).

# Todas las operations piden sesión demo salvo que declaren `security: []`.
security:
  - demoSession: []

tags:
  - name: auth
    description: |
      Sesión demo, takeover de un slot, logout y ticket efímero para
      `GET /events`. `POST /auth/demo-session` es la única operation pública;
      `POST /auth/takeover` pide sesión porque el desalojo necesita un sujeto: es
      el invitado que pasa a humano o el navegador que cambia de perfil.
  - name: events
    description: |
      Stream SSE y polling del mismo log de eventos. El orden lo da `seq`, no
      `occurredAt`; el cliente deduplica con `seq <= lastSeen`.
  - name: catalog
    description: |
      Regiones y zonas de la demo. Sólo proyecciones: `ZoneSummary` lleva
      `zoneKey`, `nameKey` y `regionKey`, nunca geometría. El polígono vive en
      `contract/catalog/zones.json`, fuera del spec.
  - name: profiles
    description: |
      Perfiles del catálogo demo: 10 humanos por región (`mx`, `co`). La fila es
      `ProfileSummary`, con los campos del dataset más `regionKey`, `demoSlot` y
      `sourceType`. El avatar se resuelve por `photoId`; ningún response expone
      coordenadas.
  - name: presence
    description: |
      Dónde está la sesión. `PUT /presence` es la única entrada del contrato que
      acepta coordenadas: recibe un punto privado o una `demoZoneKey` y devuelve
      la proyección (`regionKey`, `zoneKey`), nunca el punto. Región y zona se
      derivan con `ST_Covers` contra los polígonos del catálogo; fuera de todo
      polígono es `fallbackRequired: true`, no un error.
  - name: discovery
    description: |
      Quién está cerca. Devuelve `ProfileSummary` filtrado por radio, intención,
      género, verificado y online. `distanceM` y `bearingDeg` los calcula el
      server y se redondean al metro y al grado; la respuesta no lleva el punto de
      nadie.
  - name: pings
    description: |
      El flujo de conexión de S4. Un ping es una propuesta de una dirección;
      aceptarlo crea **un** `Match` por par y rechazarlo no crea nada. La bandeja
      (`GET /pings?box=`) trae el ping y la proyección del otro perfil, sin
      coordenadas: quién fue, no dónde está. Un bot acepta solo, así la demo se
      siente viva sin que nadie mire la pantalla del bot.
  - name: matches
    description: |
      El chat de S4. Un match es una conversación: `GET /matches` es la bandeja
      (con el otro perfil, el último mensaje y `unreadCount`), `GET
      /matches/{matchId}/messages` la conversación paginada y `POST
      /matches/{matchId}/messages` la escritura idempotente por
      `clientMessageId`. `POST /matches/{matchId}/read` apaga el badge. Si el otro
      lado es un bot, responde solo. Sin coordenadas: un chat cuenta quién habló,
      no dónde estaba.
  - name: blocks
    description: |
      Bloqueo de S5. `GET /blocks` lista lo que la sesión bloqueó, `POST /blocks`
      bloquea (idempotente) y `DELETE /blocks/{profileId}` revierte. El efecto es
      bidireccional: el par no se ve en discovery, no se puede pinguear y la
      conversación existente no acepta mensajes nuevos. Bloquear un bot bloquea a
      su dueño.
  - name: reports
    description: |
      Reporte de S5. `POST /reports` registra la señal con un motivo cerrado y
      devuelve un acuse sin identidad del reportado. No hay consola de
      moderación ni lectura de reportes: la demo registra, no modera.
  - name: notifications
    description: |
      Campana de S5. `GET /notifications` trae los avisos persistidos (ping
      recibido, match creado, mensaje nuevo) con `unreadCount`, y
      `POST /notifications/read` los marca leídos (todos o por id). Aditivo: el
      badge de pings pendientes del cliente sigue disponible.

