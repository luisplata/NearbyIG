<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Authentic 2024 Instagram Vibrant Gradient -->
    <linearGradient id="ig-grad" x1="0.1" y1="0.9" x2="0.9" y2="0.1">
      <stop offset="0%" stop-color="#FFD600"/>
      <stop offset="12%" stop-color="#FF6B00"/>
      <stop offset="35%" stop-color="#FF0069"/>
      <stop offset="65%" stop-color="#D300C5"/>
      <stop offset="85%" stop-color="#7638FA"/>
      <stop offset="100%" stop-color="#3858FA"/>
    </linearGradient>

    <!-- Warm Golden Light Radial Burst (Bottom-Left) -->
    <radialGradient id="ig-glow-bottom" cx="15%" cy="92%" r="72%">
      <stop offset="0%" stop-color="#FFEE55" stop-opacity="0.85"/>
      <stop offset="30%" stop-color="#FF9500" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#FF2D55" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF2D55" stop-opacity="0"/>
    </radialGradient>

    <!-- Deep Blue-Violet Ambient Light (Top-Right) -->
    <radialGradient id="ig-glow-top" cx="88%" cy="12%" r="68%">
      <stop offset="0%" stop-color="#3D5AFE" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#7C4DFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7C4DFF" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="squircle-clip">
      <rect width="512" height="512" rx="116" ry="116"/>
    </clipPath>
  </defs>

  <!-- Cropped Squircle App Icon Base (Exact 1:1 Aspect, No Outer White Padding) -->
  <g clip-path="url(#squircle-clip)">
    <rect width="512" height="512" fill="url(#ig-grad)"/>
    <rect width="512" height="512" fill="url(#ig-glow-bottom)"/>
    <rect width="512" height="512" fill="url(#ig-glow-top)"/>

    <!-- Center Camera Lens Ring -->
    <circle
      cx="256"
      cy="256"
      r="96"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="36"
    />

    <!-- Camera Outer Frame Outline (Left, Bottom, Right & Top) -->
    <path
      d="M 308 86
         L 162 86
         A 76 76 0 0 0 86 162
         L 86 350
         A 76 76 0 0 0 162 426
         L 350 426
         A 76 76 0 0 0 426 350
         L 426 135"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="36"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Integrated Location Pin Marker at Top-Right Corner -->
    <path
      d="M 339.4 172.6
         L 402.8 163.5
         A 48 48 0 1 0 348.5 109.2
         Z
         M 396 116
         A 20 20 0 1 1 396 115.99
         Z"
      fill="#FFFFFF"
      fill-rule="evenodd"
    />
  </g>
</svg>