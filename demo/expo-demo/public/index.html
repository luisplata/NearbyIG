<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="color-scheme" content="dark" />
    <title>%WEB_TITLE%</title>
    <!--
      Plantilla propia del export web de Expo (la misma de `@expo/cli`, en es-AR):
      `expo export` sustituye el placeholder de idioma por `web.lang` de
      app.config.ts y el del título por el nombre de la app. No se parchea `dist/`
      después del export (E-5 / F-13): el idioma del documento sale del build.
    -->
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style>
      html,
      body {
        margin: 0;
        background: #09090b;
        color: #f4f4f5;
        /*
          Pull-to-refresh propio (src/components/PullToRefresh.tsx). Sin esto el
          navegador se queda con el arrastre hacia abajo en el tope y recarga la
          página, o rebota el viewport en iOS: el gesto de la app nunca llega.
        */
        overscroll-behavior-y: contain;
      }
      #root {
        overscroll-behavior: contain;
      }
      noscript {
        display: block;
        padding: 24px;
        color: #f4f4f5;
        font: 15px/1.5 system-ui, sans-serif;
      }
    </style>
    <!--
      Foco propio: el indicador es el anillo de `src/theme/focusRing.ts`
      (`box-shadow`, sigue el border-radius y no mueve el layout). Se apaga el
      outline nativo en los dos selectores para que el navegador no dibuje su
      rectángulo encima. No se deja la UI sin foco visible: el anillo está.
    -->
    <style id="focus-ring">
      :focus {
        outline: none;
      }
      :focus-visible {
        outline: none;
      }
    </style>
  </head>

  <body>
    <noscript>Esta demo necesita JavaScript. No hay red ni servicios: todos los datos son ficticios.</noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
