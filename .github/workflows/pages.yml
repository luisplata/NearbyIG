name: pages

# Un solo workflow publica un único artefacto de Pages:
#   /            landing
#   /expo/       demo Expo web
#   /contract/   doc estático del contrato
#
# El sitio tiene que existir en Settings → Pages → Source: GitHub Actions.
# Este workflow NO habilita Pages: si todavía no está habilitado, `configure-pages`
# falla antes de cualquier build y no se publica nada (ver docs/pages-handoff.md).
#
# `pages: read` a nivel workflow permite que `actions/configure-pages` lea el sitio
# (GET /repos/{owner}/{repo}/pages) en los jobs que lo necesitan. Publicar sigue
# exigiendo `pages: write` + `id-token: write`, declarados sólo en el job de deploy.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Validación del contrato y de la app Expo. Corre siempre, también en PR.
  # Nada se construye si esto falla.
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/expo-demo/package-lock.json

      - name: Install tooling
        run: npm ci

      - name: Validate fixtures
        run: node scripts/validate-fixtures.mjs

      - name: Check generated contract (anti-drift)
        run: node scripts/sync-demo-assets.mjs --check

      - name: Test tooling
        run: npm run test:scripts

      - name: Install Expo dependencies
        run: npm --prefix demo/expo-demo ci

      - name: Expo typecheck
        run: npm --prefix demo/expo-demo run typecheck

      - name: Expo tests (golden regression)
        run: npm --prefix demo/expo-demo run test

  # Build + ensamblado + auditoría. Sólo en main (push o dispatch), nunca en PR.
  build:
    name: build
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Primero que los builds: el base path real ("" en sitio de usuario,
      # /repo en sitio de proyecto). Nunca se hardcodea. Lee el sitio con el
      # `pages: read` del nivel workflow.
      - name: Resolve Pages base path
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/expo-demo/package-lock.json

      # Evita dobles barras y barras finales antes de pasarlo a los builds.
      - name: Check base path
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail
          case "$BASE_PATH" in
            "")
              echo "base_path vacío: sitio de usuario (/, /expo/, /contract/)"
              ;;
            /*)
              if [ "${BASE_PATH%/}" != "$BASE_PATH" ]; then
                echo "base_path con barra final: $BASE_PATH"
                exit 1
              fi
              echo "base_path de proyecto: $BASE_PATH"
              ;;
            *)
              echo "base_path inválido: $BASE_PATH"
              exit 1
              ;;
          esac

      - name: Install tooling
        run: npm ci

      # Doc estático del contrato: contract/dist/index.html, autocontenido y con
      # la telemetría de Redoc apagada. Se publica en /contract/ y lo audita el
      # ensamblado, así que falla antes de los builds si el doc no cierra.
      - name: Build contract docs
        run: npm run contract:docs

      - name: Install Expo dependencies
        run: npm --prefix demo/expo-demo ci

      - name: Expo export
        working-directory: demo/expo-demo
        env:
          # Expo exige barra inicial y prohíbe la final.
          EXPO_BASE_URL: ${{ steps.pages.outputs.base_path }}/expo
          # Endpoint del backend para el build. Se define como variable del repo
          # (`NEARBYIG_API_URL`) porque un túnel cambia de URL: actualizás la
          # variable y re-corrés el workflow, sin tocar código. Vacío ⇒ live
          # deshabilitado y el artefacto queda como el mock.
          EXPO_PUBLIC_API_URL: ${{ vars.NEARBYIG_API_URL }}
        run: npx expo export --platform web --output-dir dist --clear

      # Ensambla site/ y audita: landing + expo, /contract/, denylist,
      # hosts, datasetId. Falla antes del upload si algo no cierra: nunca hay
      # deploy parcial.
      - name: Assemble and audit site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # El audit acepta exactamente el host de la API que el build horneó.
          PAGES_API_URL: ${{ vars.NEARBYIG_API_URL }}
        run: node scripts/assemble-site.mjs --strict site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  # Publicación con permisos mínimos: pages/id-token sólo acá.
  deploy:
    name: deploy
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
